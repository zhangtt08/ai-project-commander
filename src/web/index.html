<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="google" content="notranslate" />
<title>AI Project Commander</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/x-icon" href="/icons/app.ico" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="theme-color" content="#5E6AD2" />
<meta name="application-name" content="AI Project Commander" />
<meta name="mobile-web-app-capable" content="yes" />
<script>
  // Theme bootstrap runs before first paint to avoid a flash of the wrong theme.
  try {
    var t = localStorage.getItem('commander.theme.v2');
    if (t !== 'light' && t !== 'dark') t = 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app-shell">
  <aside id="sidebar" aria-label="主导航">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <strong>Project Commander</strong>
        <small>AI 编码项目控制面</small>
      </span>
    </div>
    <nav id="nav" aria-label="分区"></nav>
    <div class="sidebar-footer">
      <div id="sidebar-tools"></div>
      <div id="system-pill" class="pill pill-idle">连接中…</div>
      <div class="sidebar-links">
        <a href="#/settings">设置</a>
        <span aria-hidden="true">·</span>
        <a href="/api/security" target="_blank" rel="noopener">安全模型（原始 JSON）</a>
      </div>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <header id="topbar"></header>
    <div id="view" aria-live="polite"></div>
  </main>
</div>
<div id="toast-region" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
